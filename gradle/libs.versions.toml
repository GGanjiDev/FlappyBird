[versions]
# Must match the versions bundled by KorGE 6.0.0 (Kotlin 2.0.20)
kotlinx-coroutines = "1.9.0-RC.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Version is resolved automatically by the KorGE plugin (configureAutoVersions)
korge = { module = "com.soywiz.korlibs.korge2:korge" }

# NOTE: settings.gradle.kts parses this file to find the KorGE version.
# Keep [plugins] as the LAST section and the `korge = ...` line inside it.
[plugins]
korge = { id = "com.soywiz.korge", version = "6.0.0" }
#korge = { id = "com.soywiz.korge", version = "999.0.0.999" }
