# Phiên bản PHẢI khớp với app chủ KMP-SevenBalls (gradle/libs.versions.toml của SevenBalls),
# nếu không app chủ sẽ gặp lỗi metadata Kotlin / Compose khi dùng thư viện.
[versions]
agp = "8.13.2"
kotlin = "2.3.0"
compose-multiplatform = "1.9.3"
compose-webview-multiplatform = "2.0.3"
android-compileSdk = "36"
android-minSdk = "26"

[libraries]
compose-webview-multiplatform = { module = "io.github.kevinnzou:compose-webview-multiplatform", version.ref = "compose-webview-multiplatform" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
